<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>AVR PHOTO EDITS — Pro Max Mega v10</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@300;400;600;700&family=Playfair+Display:wght@700;900&family=Bebas+Neue&family=Pacifico&family=Fredoka+One&family=Anton&family=Righteous&family=Press+Start+2P&family=Lobster&family=Dancing+Script:wght@700&family=Monoton&family=Audiowide&family=Russo+One&family=Bungee&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- Splash -->
<div id="splash" class="splash">
  <div class="logo-scene">
    <div class="particles">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>
    <div class="new-logo">
      <div class="logo-ring outer"></div>
      <div class="logo-ring inner"></div>
      <div class="logo-core">
        <svg viewBox="0 0 100 100" class="logo-svg">
          <defs>
            <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#8b5cf6"/>
              <stop offset="50%" stop-color="#ec4899"/>
              <stop offset="100%" stop-color="#06b6d4"/>
            </linearGradient>
            <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#f59e0b"/>
              <stop offset="100%" stop-color="#ec4899"/>
            </linearGradient>
          </defs>
          <path d="M 15 75 L 30 25 L 45 75 M 22 60 L 38 60" stroke="url(#grad1)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="65" cy="50" r="18" stroke="url(#grad2)" stroke-width="3" fill="none"/>
          <circle cx="65" cy="50" r="8" fill="url(#grad1)"/>
          <circle cx="65" cy="50" r="3" fill="#fff"/>
        </svg>
      </div>
    </div>
    <div class="logo-text">
      <h1 class="brand-line">
        <span class="letter">A</span><span class="letter">V</span><span class="letter">R</span>
      </h1>
      <h2 class="studios-line">PHOTO EDITS</h2>
      <p class="tagline-line">MEGA v10.0 · 100+ Tools</p>
    </div>
  </div>
  <div class="loader-bar"><div class="loader-fill"></div></div>
</div>

<!-- BG Orbs -->
<div class="bg-animation">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
</div>

<!-- Header -->
<header class="header">
  <button class="header-btn" id="closeAppBtn" title="Add Photo"><i class="fas fa-plus"></i></button>
  <div class="header-center">
    <button class="header-btn" id="undoBtn" title="Undo"><i class="fas fa-undo"></i></button>
    <button class="header-btn" id="redoBtn" title="Redo"><i class="fas fa-redo"></i></button>
  </div>
  <div class="header-right">
    <button class="header-btn" id="compareBtn" title="Before/After"><i class="fas fa-eye"></i></button>
    <button class="header-btn" id="downloadBtn" title="Save"><i class="fas fa-download"></i></button>
    <button class="header-btn" id="shareBtn" title="Share"><i class="fas fa-share-alt"></i></button>
  </div>
</header>

<!-- Canvas Area -->
<main class="canvas-area" id="canvasArea">
  <div class="canvas-wrapper" id="canvasWrapper">
    <canvas id="canvas" width="800" height="500"></canvas>
    <canvas id="drawLayer" class="draw-layer"></canvas>
    <canvas id="cropOverlay" class="crop-overlay"></canvas>
    <div class="crop-help" id="cropHelp">
      <i class="fas fa-arrows-alt"></i> Drag to move · Drag corners/edges to resize
    </div>
    
    <div class="drop-zone" id="dropZone">
      <i class="fas fa-cloud-upload-alt"></i>
      <h3>Tap to Add Photo</h3>
      <p>100+ tools for pro editing ✨</p>
    </div>
  </div>
  
  <div class="ai-loading" id="aiLoading">
    <div class="ai-spinner"></div>
    <p>AI Processing...</p>
    <span id="aiProgress">0%</span>
  </div>
</main>

<!-- Bottom Toolbar -->
<nav class="bottom-toolbar" id="bottomToolbar">
  <button class="bt-btn active" data-tool="adjust"><div class="bt-icon"><i class="fas fa-sliders-h"></i></div><span>Adjust</span></button>
  <button class="bt-btn" data-tool="light"><div class="bt-icon"><i class="fas fa-sun"></i></div><span>Light</span></button>
  <button class="bt-btn" data-tool="color"><div class="bt-icon"><i class="fas fa-palette"></i></div><span>Color</span></button>
  <button class="bt-btn" data-tool="detail"><div class="bt-icon"><i class="fas fa-search-plus"></i></div><span>Detail</span></button>
  <button class="bt-btn" data-tool="tone"><div class="bt-icon"><i class="fas fa-chart-line"></i></div><span>Tone</span></button>
  <button class="bt-btn" data-tool="curve"><div class="bt-icon"><i class="fas fa-bezier-curve"></i><span class="badge">NEW</span></div><span>Curves</span></button>
  <button class="bt-btn" data-tool="hsl"><div class="bt-icon"><i class="fas fa-circle-half-stroke"></i><span class="badge">NEW</span></div><span>HSL</span></button>
  <button class="bt-btn" data-tool="crop"><div class="bt-icon"><i class="fas fa-crop-alt"></i><span class="badge">★</span></div><span>Crop</span></button>
  <button class="bt-btn" data-tool="perspective"><div class="bt-icon"><i class="fas fa-vector-square"></i><span class="badge">NEW</span></div><span>Perspective</span></button>
  <button class="bt-btn" data-tool="filters"><div class="bt-icon"><i class="fas fa-filter"></i></div><span>Filters</span></button>
  <button class="bt-btn" data-tool="effects"><div class="bt-icon"><i class="fas fa-magic"></i><span class="dot purple"></span></div><span>Effects</span></button>
  <button class="bt-btn" data-tool="blur"><div class="bt-icon"><i class="fas fa-water"></i><span class="badge">NEW</span></div><span>Blur</span></button>
  <button class="bt-btn" data-tool="portrait"><div class="bt-icon"><i class="fas fa-user-circle"></i></div><span>Portrait</span></button>
  <button class="bt-btn" data-tool="retouch"><div class="bt-icon"><i class="fas fa-band-aid"></i></div><span>Retouch</span></button>
  <button class="bt-btn" data-tool="removebg"><div class="bt-icon"><i class="fas fa-cut"></i><span class="badge">AI</span></div><span>Remove BG</span></button>
  <button class="bt-btn" data-tool="aiEnhance"><div class="bt-icon"><i class="fas fa-wand-magic-sparkles"></i><span class="badge">AI</span></div><span>AI Enhance</span></button>
  <button class="bt-btn" data-tool="sky"><div class="bt-icon"><i class="fas fa-cloud-sun"></i><span class="badge">NEW</span></div><span>Sky</span></button>
  <button class="bt-btn" data-tool="doubleExp"><div class="bt-icon"><i class="fas fa-clone"></i><span class="badge">NEW</span></div><span>Double Exp</span></button>
  <button class="bt-btn" data-tool="draw"><div class="bt-icon"><i class="fas fa-paint-brush"></i></div><span>Draw</span></button>
  <button class="bt-btn" data-tool="text"><div class="bt-icon"><i class="fas fa-font"></i><span class="badge">★</span></div><span>Text</span></button>
  <button class="bt-btn" data-tool="sticker"><div class="bt-icon"><i class="fas fa-smile"></i></div><span>Sticker</span></button>
  <button class="bt-btn" data-tool="frame"><div class="bt-icon"><i class="fas fa-square"></i></div><span>Frame</span></button>
  <button class="bt-btn" data-tool="shadow"><div class="bt-icon"><i class="fas fa-clone"></i><span class="badge">NEW</span></div><span>Shadow</span></button>
  <button class="bt-btn" data-tool="collage"><div class="bt-icon"><i class="fas fa-th"></i><span class="badge">NEW</span></div><span>Collage</span></button>
  <button class="bt-btn" data-tool="watermark"><div class="bt-icon"><i class="fas fa-copyright"></i><span class="badge">NEW</span></div><span>Watermark</span></button>
  <button class="bt-btn" data-tool="export"><div class="bt-icon"><i class="fas fa-file-export"></i></div><span>Export</span></button>
</nav>

<!-- Panel -->
<div class="panel-overlay" id="panelOverlay"></div>
<aside class="panel" id="panel">
  <div class="panel-handle"></div>
  <div class="panel-header">
    <h3 id="panelTitle">Adjust</h3>
    <button class="panel-close-btn" id="panelClose"><i class="fas fa-times"></i></button>
  </div>
  <div class="panel-tabs" id="panelTabs"></div>
  <div class="panel-content" id="panelContent"></div>
  <div class="panel-footer" id="panelFooter"></div>
</aside>

<!-- Toast -->
<div id="toast" class="toast"></div>

<!-- Camera Modal -->
<div id="cameraModal" class="modal">
  <div class="modal-content">
    <h2><i class="fas fa-camera"></i> Camera</h2>
    <video id="video" autoplay playsinline></video>
    <div class="modal-actions">
      <button class="btn-primary" id="captureBtn"><i class="fas fa-camera"></i> Capture</button>
      <button class="btn-secondary" id="closeCamera">Close</button>
    </div>
  </div>
</div>

<!-- Source Modal -->
<div id="sourceModal" class="modal">
  <div class="modal-content">
    <h2><i class="fas fa-plus"></i> Add Photo</h2>
    <div class="source-grid">
      <button class="source-btn" id="fromGallery"><i class="fas fa-image"></i><span>Gallery</span></button>
      <button class="source-btn" id="fromCamera"><i class="fas fa-camera"></i><span>Camera</span></button>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" id="closeSource">Cancel</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix@2.2.0/dist/body-pix.min.js"></script>
<script src="script.js"></script>
</body>
</html>
